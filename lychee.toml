# Link checker settings, shared by CI and the weekly scheduled check.
# Internal links are checked against the built files in dist/ (via --root-dir).

# Check #anchors as well as pages.
include_fragments = "full"
# Resolve directory links like /projects/ to their index.html.
index_files = ["index.html"]

max_retries = 3
retry_wait_time = 5
timeout = 20
accept = ["200..=299"]

exclude = [
  # LinkedIn answers automated requests with HTTP 999, so it can't be checked by a bot.
  '^https://(www\.)?linkedin\.com/',
  # The site's own absolute URLs (canonical links) only exist after a deploy;
  # the same pages are checked as local files.
  '^https://ca15y\.vercel\.app/',
]
